name: weknora-relay
on:
  workflow_dispatch:

env:
  REG: crpi-hui3esaavbva0p7t.cn-shanghai.personal.cr.aliyuncs.com

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Discover available tags
        run: |
          for r in weknora-app weknora-ui weknora-docreader; do
            echo "========== $r =========="
            curl -fsSL "https://hub.docker.com/v2/repositories/wechatopenai/$r/tags?page_size=50&ordering=last_updated" \
              | grep -o '"name":"[^"]*"' | cut -d'"' -f4 | head -25
          done
